# Licence policy for scripts/third-party-notices.py: which licences may ship in
# a BroScribe binary (Apache-2.0, AGENTS.md) and reviewed corrections for
# crates whose metadata alone cannot be trusted. Any licence not listed here
# fails the bundle; a missing licence text makes the inventory incomplete,
# which local builds may carry but distribution (notarization) refuses.

# SPDX identifiers that may be distributed in a BroScribe binary. An SPDX
# expression passes when one of its OR alternatives uses allowed licences only.
allowed = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  # SIL Open Font License 1.1, for the fonts the app bundles (Inter, Manrope;
  # crates/broscribe-app/assets/ASSET_LICENSES.toml). Compatible with an
  # Apache-2.0 app: the fonts ship as they are, with their copyright notices
  # and licence text, and are never sold by themselves (decision 2026-11-21).
  "OFL-1.1",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # The Unicode, Inc. copyright and permission notice (1991-2007) that
  # utf8proc's LICENSE.md reproduces for its Unicode data; permissive, met by
  # shipping the notice unmodified (third_party/sherpa-onnx/NATIVE_LICENSES.toml).
  "LicenseRef-utf8proc-Unicode-data",
  "Unlicense",
  "Zlib",
]

# Licences with no attribution or notice requirement: no licence text needed.
no_notice = ["0BSD", "CC0-1.0", "MIT-0", "Unlicense"]

# Preferred alternative when an expression offers a choice; earlier wins.
preference = [
  "Apache-2.0",
  "MIT",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "MIT-0",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "NCSA",
  "bzip2-1.0.6",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "OFL-1.1",
]

# Reviewed licence for a crate that declares only `license-file`. Pinned to the
# crate version and the SHA-256 of that file, so any change fails until it is
# reviewed again.
[[override]]
name = "model2vec-rs"
version = "0.4.0"
license = "MIT"
file = "LICENSE"
sha256 = "6869ad291a9df9866448579b7157bf337373a21ced5b4b315e68b2924aff2ab9"
evidence = "Crate manifest has license-file = \"LICENSE\" and no SPDX licence; the shipped LICENSE is the MIT License text (Copyright (c) 2025 The Minish Lab)."

# Licence texts a crate does not ship, each reviewed from the crate's upstream
# repository at the locked version (commit from the package's
# .cargo_vcs_info.json) and pinned by SHA-256. Where upstream publishes no
# licence text at all, the SPDX License List text of the declared licence is
# used and the evidence says so; nothing here invents a copyright holder.
# Reviewed 2026-11-17. Not listed: crates never linked into a shipped binary
# (libfuzzer-sys is cfg(fuzzing) only; simd_helpers is a proc macro) and
# libbz2-rs-sys, whose shipped LICENSE is its bzip2-1.0.6 text.

