# BroScribe CI. Runs on pull requests into main and pushes to main. The
# merge-gate job ("BroScribe CI") is the required status check (docs/release.md).
#
# Supply-chain rules (AGENTS.md, docs/design.md §13):
# - No third-party or GitHub-authored actions (`uses:`). Checkout is a plain
#   `git fetch` of the exact commit; the job token reaches git only through
#   GIT_CONFIG_* environment variables, never argv, and is masked.
# - Rust is the pinned toolchain from rust-toolchain.toml (1.100.0, which enforces
#   `registry.global-min-publish-age`); every Cargo command uses --locked.
# - Native sherpa-onnx archives come only from third_party/sherpa-onnx/fetch.sh,
#   which checks them against SHA256SUMS. Nothing is installed from unpinned
#   package managers on the macOS and Windows runners; missing prerequisites fail.
# - The Linux job runs scripts/docker-linux-test.sh: the digest-pinned Rust 1.100.0
#   image, a workspace feature tree with no Metal, then build and tests.
#
# A green run is compile/unit-test evidence on hosted runners with fakes and
# synthetic fixtures. It is not hardware, permission, meeting-app, sign-in,
# notarization or desktop-runtime acceptance (docs/acceptance.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUSTUP_AUTO_INSTALL: "0"

defaults:
  run:
    shell: bash

jobs:
  supply-chain:
    name: Lock age, script tests and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          git init --quiet .
          git config core.autocrlf false
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git fetch --quiet --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD
          git log -1 --format='checked out %H'

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          if [[ "$channel" != "$RUST_TOOLCHAIN" ]]; then
            echo "rust-toolchain.toml pins ${channel}; the workflow expects ${RUST_TOOLCHAIN}" >&2
            exit 1
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F "rustc ${RUST_TOOLCHAIN} "
          cargo --version | grep -F "cargo ${RUST_TOOLCHAIN} "

      - name: Lock-file publish age, yanked versions and sources
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/check-publish-age.py Cargo.lock

      - name: Shipping-script unit tests (offline fixtures)
        run: python3 -m unittest discover -s scripts/tests

      - name: Formatting
        run: cargo fmt --all --check

  macos:
    name: macOS arm64 (clippy, tests)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out the exact commit
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          git init --quiet .
          git config core.autocrlf false
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git fetch --quiet --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD
          git log -1 --format='checked out %H'

      - name: Native prerequisites (Apple silicon, Xcode, CMake)
        run: |
          set -euo pipefail
          # Only osx-arm64 sherpa-onnx libraries are pinned: BroScribe builds for Apple silicon.
          [[ "$(uname -m)" == arm64 ]] || { echo "expected an arm64 runner, got $(uname -m)" >&2; exit 1; }
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          # whisper.cpp builds with CMake; fail rather than install an unpinned copy.
          command -v cmake >/dev/null || { echo "cmake is required (whisper.cpp)" >&2; exit 1; }
          cmake --version | head -n 1
          command -v bzip2 >/dev/null

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [[ "$channel" == "$RUST_TOOLCHAIN" ]] || { echo "rust-toolchain.toml pins ${channel}" >&2; exit 1; }
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F "rustc ${RUST_TOOLCHAIN} "
          rustc -vV | grep -Fx 'host: aarch64-apple-darwin'

      - name: Fetch and verify sherpa-onnx (osx-arm64)
        run: third_party/sherpa-onnx/fetch.sh --target osx-arm64

      - name: Clippy (warnings are errors)
        run: scripts/build-target.sh aarch64-apple-darwin clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: scripts/build-target.sh aarch64-apple-darwin test --locked --workspace

      - name: Verify the macOS third-party licence inventory
        run: python3 scripts/third-party-notices.py --target aarch64-apple-darwin --native-lib-dir third_party/sherpa-onnx/lib-osx-arm64 --out-dir "$RUNNER_TEMP/broscribe-notices"

      - name: Lock file unchanged
        run: git diff --exit-code -- Cargo.lock

  linux:
    name: Linux ${{ matrix.arch }} container (no Metal, build, tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            args: ""
          - arch: x64
            runner: ubuntu-24.04
            machine: x86_64
            args: --amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - name: Check out the exact commit
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          git init --quiet .
          git config core.autocrlf false
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git fetch --quiet --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD
          git log -1 --format='checked out %H'

      - name: Verify the native Linux container host
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "$EXPECTED_MACHINE" ]] || { echo "expected $EXPECTED_MACHINE, got $(uname -m)" >&2; exit 1; }
          docker version --format '{{.Server.Version}}'

      - name: Workspace build and tests in the pinned image
        env:
          CARGO_BUILD_JOBS: "2"
          LINUX_BASELINE: ${{ matrix.args }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$LINUX_BASELINE" ]]; then args+=("$LINUX_BASELINE"); fi
          scripts/docker-linux-test.sh "${args[@]}"
          git diff --exit-code -- Cargo.lock

  windows:
    name: Windows x86-64 MSVC (clippy, debug/release, tests)
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - name: Check out the exact commit
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          git init --quiet .
          # Shell scripts must keep LF endings for Git Bash.
          git config core.autocrlf false
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git fetch --quiet --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD
          git log -1 --format='checked out %H'

      - name: Native prerequisites (CMake and PowerShell)
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || { echo "cmake is required (whisper.cpp)" >&2; exit 1; }
          cmake --version | head -n 1
          command -v bzip2 >/dev/null
          command -v powershell.exe >/dev/null

      - name: Native Windows prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools are required.' }
          $env:BROSCRIBE_VSDEVCMD = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          Push-Location $env:RUNNER_TEMP
          try {
            @('call "%BROSCRIBE_VSDEVCMD%" -no_logo -host_arch=x64 -arch=x64 >nul',
              'if errorlevel 1 exit /b 1', 'set') | Set-Content -Encoding ascii broscribe-msvc.cmd
            $variables = & cmd.exe /d /c broscribe-msvc.cmd
            if ($LASTEXITCODE -ne 0) { throw 'Visual Studio environment setup failed.' }
          } finally {
            Remove-Item -Force broscribe-msvc.cmd -ErrorAction SilentlyContinue
            Pop-Location
          }
          $allowed = '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|WindowsSdkBinPath|WindowsSdkVerBinPath|UniversalCRTSdkDir|UCRTVersion)='
          $variables | Where-Object { $_ -match $allowed } | Add-Content $env:GITHUB_ENV
          $vc = ($variables | Where-Object { $_ -match '^VCToolsInstallDir=' }) -replace '^VCToolsInstallDir=', ''
          if (!$vc) { throw 'MSVC tool path is missing.' }
          Join-Path $vc 'bin/Hostx64/x64' | Add-Content $env:GITHUB_PATH
          "BROSCRIBE_MSVC_BIN=$(Join-Path $vc 'bin/Hostx64/x64')" | Add-Content $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'bs')" | Add-Content $env:GITHUB_ENV
          'CARGO_BUILD_JOBS=1' | Add-Content $env:GITHUB_ENV

      - name: Install the pinned Rust toolchain (MSVC host)
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [[ "$channel" == "$RUST_TOOLCHAIN" ]] || { echo "rust-toolchain.toml pins ${channel}" >&2; exit 1; }
          # rust-toolchain.toml lists both components; install them so no implicit install runs.
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F "rustc ${RUST_TOOLCHAIN} "
          rustc -vV | grep -Fx 'host: x86_64-pc-windows-msvc'

      # The prebuilt Windows libraries are MSVC /MT objects; they do not link with
      # the GNU target (docs/design.md §13).
      - name: Fetch and verify sherpa-onnx (win-x64)
        run: third_party/sherpa-onnx/fetch.sh --target win-x64

      - name: Clippy (warnings are errors)
        run: |
          set -euo pipefail
          msvc_bin="$(cygpath -u "$BROSCRIBE_MSVC_BIN")"
          export PATH="$msvc_bin:$PATH"
          scripts/build-target.sh x86_64-pc-windows-msvc clippy --locked --workspace --all-targets -- -D warnings

      - name: Cleanup matcher (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -File crates/broscribe-platform-windows/tests/cleanup-matcher.Tests.ps1

      - name: Cleanup matcher (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File crates/broscribe-platform-windows/tests/cleanup-matcher.Tests.ps1

      # Linking and fake/synthetic tests are distinct from Windows hardware,
      # permissions, UI Automation, credentials, tray and GUI acceptance.
      - name: Workspace debug build, all targets
        run: |
          set -euo pipefail
          msvc_bin="$(cygpath -u "$BROSCRIBE_MSVC_BIN")"
          export PATH="$msvc_bin:$PATH"
          scripts/build-target.sh x86_64-pc-windows-msvc build --locked --workspace --all-targets

      - name: Workspace release build, all targets
        run: |
          set -euo pipefail
          msvc_bin="$(cygpath -u "$BROSCRIBE_MSVC_BIN")"
          export PATH="$msvc_bin:$PATH"
          scripts/build-target.sh x86_64-pc-windows-msvc build --locked --workspace --all-targets --release

      - name: Workspace tests (fakes and synthetic fixtures)
        run: |
          set -euo pipefail
          msvc_bin="$(cygpath -u "$BROSCRIBE_MSVC_BIN")"
          export PATH="$msvc_bin:$PATH"
          scripts/build-target.sh x86_64-pc-windows-msvc test --locked --workspace

      - name: Verify the Windows third-party licence inventory
        env:
          # cargo metadata is UTF-8; Windows Python otherwise decodes it as cp1252.
          PYTHONUTF8: "1"
        run: python scripts/third-party-notices.py --target x86_64-pc-windows-msvc --native-lib-dir third_party/sherpa-onnx/lib-win-x64 --out-dir "$RUNNER_TEMP/broscribe-notices"

      - name: Lock file unchanged
        run: git diff --exit-code -- Cargo.lock

  merge-gate:
    name: BroScribe CI
    if: ${{ always() }}
    needs: [supply-chain, macos, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require success from every lane
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: python3 -c 'import json, os, sys; results = json.loads(os.environ["RESULTS"]); print(results); sys.exit(0 if results == ["success"] * 4 else 1)'
