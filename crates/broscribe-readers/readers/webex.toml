# Candidate structural anchors only. Owner must verify these in a synthetic call.
id = "webex"
# macOS bundle ids, Linux PipeWire application ids / binary names and Windows
# executable file names (detect.toml identities), matched case-insensitively.
# `ptoneclk.exe` (scheduling add-in) is detected but has no meeting UI to read.
bundle_ids = [
    "Cisco-Systems.Spark", "com.cisco.webexmeetingsapp", "com.webex.meetingmanager",
    "webex", "com.cisco.Webex", "webex.exe", "CiscoCollabHost.exe", "WebexHost.exe",
]
verified = false
structural_verified = false
manual_accessibility = false

[self_labels]
en = ["You", "Me"]
pt = ["Você", "Eu"]
es = ["Tú", "Yo"]
fr = ["Vous", "Moi"]
de = ["Du", "Ich"]

[roster]
items = 'AXOutline[identifier="participants"] AXRow'
[roster.name]
selector = 'AXStaticText'
attribute = "value"
index = 0
[roster.email]
selector = 'AXStaticText[identifier="email"]'
attribute = "value"

[captions]
items = 'AXGroup[identifier="closed-captions"] > AXGroup'
[captions.id]
attribute = "identifier"
[captions.speaker]
selector = 'AXStaticText'
attribute = "value"
index = 0
[captions.text]
selector = 'AXStaticText'
attribute = "value"
index = 1
