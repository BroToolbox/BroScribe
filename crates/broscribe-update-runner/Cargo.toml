[package]
name = "broscribe-update-runner"
description = "BroScribe's external update runner and the update records shared with `broscribe update`"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "broscribe-update-runner"
path = "src/main.rs"

[dependencies]
# Minimal on purpose: it runs from outside the installation while every
# BroScribe process is stopped, so no model, inference or UI crate (and no
# DLL that lives in the installation) may be loaded. OS access only through
# the platform traits.
broscribe-core.workspace = true
broscribe-platform.workspace = true
broscribe-platform-native.workspace = true
broscribe-updates.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
# The updater's own archive reader configuration (already locked).
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true
