[package]
name = "broscribe-cli"
description = "The broscribe command-line interface and MCP server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "broscribe"
path = "src/main.rs"

[dependencies]
broscribe-core.workspace = true
broscribe-models.workspace = true
broscribe-pipeline.workspace = true
broscribe-platform.workspace = true
broscribe-platform-native.workspace = true
broscribe-ipc.workspace = true
broscribe-detect.workspace = true
broscribe-dsp.workspace = true
broscribe-integrations.workspace = true
broscribe-readers.workspace = true
broscribe-updates.workspace = true
broscribe-update-runner.workspace = true
broscribe-capture.workspace = true
chrono.workspace = true
clap.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# In-process inference (setup checks, voice, bench, import): whisper.cpp's
# Metal backend on macOS only; Linux and Windows build the CPU backend.
[target.'cfg(target_os = "macos")'.dependencies]
broscribe-models = { workspace = true, features = ["metal"] }

[dev-dependencies]
broscribed.workspace = true
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true
tokio.workspace = true
sha2.workspace = true
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true
