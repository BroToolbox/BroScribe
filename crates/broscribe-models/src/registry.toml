# ---------------------------------------------------------------------------
# LLM providers (design §8.4; plan M2 §9.7). Off until the user enables one and
# accepts its consent text. Agent CLIs: flags checked against each CLI's
# `--help` on 2026-11-14 (versions in `version_checked`) and re-checked at
# runtime. `need`: "required" (the call cannot work without it) and "safety"
# (tools off, no MCP, no session persistence, user config off) refuse the
# provider when missing; "optional" is dropped and reported (degraded).
# Placeholders: {schema} (inline JSON), {schema_file}, {prompt_file} and
# {output_file} (0600 files in the call's 0700 temp dir), {model}, {timeout_s}.
# There is no placeholder for the prompt: transcripts never go in argv.
# `prompt_transport = "unverified"` registers a CLI without a verified way to
# pass the prompt off argv or to disable tools; such providers are refused.
# `[provider.models]` lists a provider's models live (`providers models <id>`):
# `args` run the CLI's own listing command (no placeholders, no meeting data),
# `format` selects the parser. Formats observed on 2026-11-15; *verify* per
# vendor release (a failed parse is an error, never a guessed list). Only
# providers with a verified prompt transport get an entry.
# `reported_model` says where the CLI reports the model that answered, so a
# summary records the version an alias or the default resolved to:
# `{ json_object, rank_by }` takes the keys of that object in the JSON
# envelope (several: the strictly largest `rank_by` number, else none);
# `{ stderr_header = { separator, prefix } }` takes the first `prefix` line
# strictly between the first two `separator` lines of stderr. Observed on
# 2026-11-15; *verify* per vendor release (nothing found: not reported).

[[provider]]
id = "claude-cli"
name = "Claude (Claude Code CLI)"
vendor = "Anthropic"
terms_url = "https://www.anthropic.com/legal/consumer-terms"
runtime = "agent-cli"
binary = "claude"
version_checked = "2.1.323"
prompt_transport = "stdin"
output = "stdout"
# `--output-format json` prints one result object; with --json-schema the
# validated object is in `structured_output`, the plain reply in `result`.
output_keys = ["structured_output", "result"]
error_flag_key = "is_error"
model_args = ["--model", "{model}"]
# The envelope's `modelUsage` maps each model used to its token counts.
reported_model = { json_object = "modelUsage", rank_by = "outputTokens" }
# Not --bare: by its help it ignores the subscription login (API keys only).
args = [
  { flag = "-p", need = "required" },
  { flag = "--output-format", values = ["json"], need = "required" },
  { flag = "--json-schema", values = ["{schema}"], need = "required" },
  { flag = "--tools", values = [""], need = "safety" },
  { flag = "--strict-mcp-config", need = "safety" },
  { flag = "--no-session-persistence", need = "safety" },
  { flag = "--safe-mode", need = "safety" },
  { flag = "--disable-slash-commands", need = "optional" },
]

# Claude Code has no list command: the aliases its `--model` help names.
[provider.models]
args = ["--help"]
format = "help-aliases"

[[provider]]
id = "codex-cli"
name = "ChatGPT (Codex CLI)"
vendor = "OpenAI"
terms_url = "https://openai.com/policies/terms-of-use/"
runtime = "agent-cli"
binary = "codex"
version_checked = "0.167.1"
subcommand = ["exec"]
help_args = ["exec", "--help"]
prompt_transport = "stdin"
output = "file"
model_args = ["-m", "{model}"]
# `-`: read the prompt from stdin.
trailing_args = ["-"]
# No `--json`: the reply is read from the -o file, and only the plain output
# prints the session header (with `model: <id>`) on stderr.
reported_model = { stderr_header = { separator = "--------", prefix = "model: " } }
args = [
  { flag = "--output-schema", values = ["{schema_file}"], need = "required" },
  { flag = "-o", values = ["{output_file}"], need = "required" },
  { flag = "--skip-git-repo-check", need = "required" },
  { flag = "--sandbox", values = ["read-only"], need = "safety" },
  { flag = "--ephemeral", need = "safety" },
  { flag = "--ignore-user-config", need = "safety" },
  { flag = "--ignore-rules", need = "safety" },
]

# Shell and tool features turned off with `--disable <feature>`; only names
# that `codex features list` reports (and not as removed) are passed.
[provider.disable_features]
flag = "--disable"
list_args = ["features", "list"]
features = [
  "shell_tool", "unified_exec", "shell_snapshot", "apps", "plugins", "hooks",
  "memories", "multi_agent", "browser_use", "browser_use_external",
  "computer_use", "image_generation", "view_image", "tool_suggest",
  "sleep_tool", "goals", "skill_mcp_dependency_install", "in_app_browser",
]

[provider.models]
args = ["debug", "models"]
format = "codex-json"

[[provider]]
id = "grok-cli"
name = "Grok (Grok CLI)"
vendor = "xAI"
terms_url = "https://x.ai/legal/terms-of-service"
runtime = "agent-cli"
binary = "grok"
version_checked = "1.0.77"
# Never `--single <prompt>`: it puts the transcript in argv.
prompt_transport = "file"
output = "stdout"
output_keys = ["structured_output", "result", "text", "content"]
model_args = ["-m", "{model}"]
# The envelope's `modelUsage` maps each model used to its token counts.
reported_model = { json_object = "modelUsage", rank_by = "outputTokens" }
args = [
  { flag = "--prompt-file", values = ["{prompt_file}"], need = "required" },
  { flag = "--output-format", values = ["json"], need = "required" },
  { flag = "--json-schema", values = ["{schema}"], need = "required" },
  { flag = "--tools", values = [""], need = "safety" },
  { flag = "--disable-web-search", need = "safety" },
  { flag = "--no-subagents", need = "safety" },
  { flag = "--no-plan", need = "optional" },
]

[provider.models]
args = ["models"]
format = "marked-lines"

[[provider]]
id = "agy-cli"
name = "Gemini (Antigravity CLI)"
vendor = "Google"
terms_url = "https://policies.google.com/terms"
runtime = "agent-cli"
binary = "agy"
version_checked = "1.5.8"
# Its help (1.5.8) shows no way to pass the print-mode prompt off argv and no
# switch that turns tools off.
prompt_transport = "unverified"
output = "stdout"
output_keys = ["structured_output", "result", "response"]
model_args = ["--model", "{model}"]
args = [
  { flag = "--print", need = "required" },
  { flag = "--output-format", values = ["json"], need = "required" },
  { flag = "--json-schema", values = ["{schema}"], need = "required" },
  { flag = "--sandbox", need = "safety" },
  { flag = "--disable-slash-commands", need = "safety" },
  { flag = "--print-timeout", values = ["{timeout_s}s"], need = "optional" },
]

[[provider]]
id = "gemini-cli"
name = "Gemini CLI"
vendor = "Google"
terms_url = "https://policies.google.com/terms"
runtime = "agent-cli"
binary = "gemini"
# Not installed when the registry was written; flags unchecked.
prompt_transport = "unverified"
output = "stdout"
output_keys = ["response"]
model_args = ["-m", "{model}"]
args = [
  { flag = "--output-format", values = ["json"], need = "required" },
]

[[provider]]
id = "opencode-cli"
name = "opencode"
vendor = "the model provider configured in opencode"
terms_url = "https://opencode.ai"
runtime = "agent-cli"
binary = "opencode"
version_checked = "2.0.11"
subcommand = ["run"]
help_args = ["run", "--help"]
# `run` takes the message in argv (`--file` only attaches a file) and has no
# switch that turns tools off.
prompt_transport = "unverified"
output = "stdout"
model_args = ["-m", "{model}"]
args = [
  { flag = "--format", values = ["json"], need = "required" },
]

# OpenAI-compatible server (Ollama, LM Studio, llama.cpp server, vLLM, paid
# APIs). `base_url` (including `/v1`) and `model` come from the provider's
# config; the API key, if any, from the SecretStore under
# `provider/openai-http/api_key`. Plain http only for loopback hosts.
[[provider]]
id = "openai-http"
name = "OpenAI-compatible API"
vendor = "the server at the configured base URL"
runtime = "openai-compatible-http"
endpoint = "chat/completions"

[provider.models]
format = "openai-models"

# Remote text embeddings (plan M2 §9.2): `/v1/embeddings` of an
# OpenAI-compatible server, with the same enablement and consent as an LLM
# provider. `base_url` (including `/v1`) and the embedding `model` come from
# this provider's config; the API key, if any, from the SecretStore under
# `provider/openai-embeddings/api_key`. Selected with
# `profile.text_embedding = "openai-embeddings"`.
[[provider]]
id = "openai-embeddings"
name = "OpenAI-compatible embeddings API"
vendor = "the server at the configured base URL"
runtime = "openai-compatible-http"
purpose = "text_embedding"
endpoint = "embeddings"

# Static multilingual text embeddings for semantic search (model2vec, 256
# dimensions, 101 languages incl. Portuguese). Loaded only from these pinned
# files, never from the hub. Files at HF revision 73908c34…, hashed 2026-11-14.
