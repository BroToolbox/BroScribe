# ---------------------------------------------------------------------------
# Profiles (design §4.1 step 3, §8.3): the speech models the setup assistant and
# `setup --profile` offer. Choosing one sets these four roles; the text-embedding
# model and LLM providers stay as the user set them. `description` names the
# speech model; the languages shown come from that model's `languages`. The shipped
# profiles keep the same speaker-embedding model, so switching never re-embeds
# the library. `default` matches the built-in config defaults. The live preview
# model follows the ASR model (itself when it has the `live` role, else its
# `live_model`) and is installed with the profile.

[[profile]]
id = "default"
description = "Parakeet TDT 0.6B v3"
vad = "silero-vad"
asr = "parakeet-tdt-0.6b-v3"
