# Built-in model registry (design §8.3). SHA-256 and sizes were computed from the
# downloaded files on 2026-11-14. A user file <data_dir>/models.toml with the same
# [[model]] format adds models or replaces entries with the same id.

[[model]]
id = "silero-vad"
display_name = "Silero VAD"
roles = ["vad"]
runtime = "onnx"
platforms = ["macos", "windows", "linux"]
languages = ["*"]
license = "MIT"
license_verified = true
accepts_hotwords = false

# Explicit Silero VAD configuration for 16 kHz input (32 ms windows). The adapter
# also splits any region longer than 30 s at its quietest 32 ms frame.
[model.params]
threshold = 0.5
min_silence_duration = 0.5
min_speech_duration = 0.25
max_speech_duration = 28.0
window_size = 512
buffer_s = 60.0
num_threads = 1

[[model.files]]
url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad_v5.onnx"
sha256 = "6b99cbfd39246b6706f98ec13c7c50c6b299181f2474fa05cbc8046acc274396"
bytes = 2313101
archive = false

[[model]]
id = "parakeet-tdt-0.6b-v3"
display_name = "Parakeet TDT 0.6B v3"
roles = ["live", "asr"]
runtime = "onnx"
platforms = ["macos", "windows", "linux"]
# The 25 European languages of Parakeet TDT 0.6B v3 (automatic language detection).
languages = [
  "bg", "hr", "cs", "da", "nl", "en", "et", "fi", "fr", "de", "el", "hu", "it",
  "lv", "lt", "mt", "pl", "pt", "ro", "sk", "sl", "es", "sv", "ru", "uk",
]
license = "CC-BY-4.0"
license_verified = true
# Hotwords need modified beam search and a BPE vocabulary the archive lacks (design §6.3).
accepts_hotwords = false

# Files relative to the archive root; greedy search, never hotwords.
[model.params]
model_type = "nemo_transducer"
encoder = "encoder.int8.onnx"
decoder = "decoder.int8.onnx"
joiner = "joiner.int8.onnx"
tokens = "tokens.txt"
num_threads = 6

[[model.files]]
url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8.tar.bz2"
sha256 = "1495e91b59d7fc53ddca91f3431758ec99f8fa253fdb0e1e851be0f72b14b0f9"
bytes = 487211443
archive = true
path_in_archive_root = "sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"

[[model]]
id = "pyannote-segmentation-3.0"
display_name = "Pyannote Segmentation 3.0"
roles = ["diarization"]
runtime = "onnx"
platforms = ["macos", "windows", "linux"]
languages = ["*"]
license = "MIT"
license_verified = true
accepts_hotwords = false

# Fast clustering with an estimated speaker count (num_clusters = -1); the
# threshold is a cosine distance. `segmentation` is relative to the archive root
# (model.int8.onnx is the quantised alternative).
# 1.0 with TitaNet-Large: the sherpa default (0.5) over-splits speakers heavily;
# 1.0 was chosen from a local sweep (results not kept in the repo). Over-splits
# left at 1.0 are repaired by the calibrated `merge` threshold (design §6.4);
# `bench` re-checks it on the user's own meetings.
[model.params]
threshold = 1.0
num_threads = 6
min_duration_on = 0.3
min_duration_off = 0.5
segmentation = "model.onnx"

[[model.files]]
url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2"
sha256 = "24615ee884c897d9d2ba09bb4d30da6bb1b15e685065962db5b02e76e4996488"
bytes = 6958444
archive = true
path_in_archive_root = "sherpa-onnx-pyannote-segmentation-3-0"

[[model]]
id = "nemo-titanet-large"
display_name = "NeMo TitaNet Large"
roles = ["speaker_embedding"]
runtime = "onnx"
platforms = ["macos", "windows", "linux"]
languages = ["*"]
license = "CC-BY-4.0"
license_verified = true
