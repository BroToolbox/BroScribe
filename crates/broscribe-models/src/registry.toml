[[profile]]
id = "multilingual"
description = "Whisper large-v3 turbo"
vad = "silero-vad"
asr = "whisper-large-v3-turbo"
diarization = "pyannote-segmentation-3.0"
speaker_embedding = "nemo-titanet-large"

