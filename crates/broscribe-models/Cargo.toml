[package]
name = "broscribe-models"
description = "BroScribe model registry, store and runtime adapters"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[features]
# whisper.cpp's Metal backend; enabled by the macOS-only target dependencies
# of the inference consumers (broscribe-cli, broscribe-worker).
metal = ["whisper-rs/metal"]

[dependencies]
broscribe-core.workspace = true
broscribe-platform.workspace = true
bzip2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
model2vec-rs.workspace = true
sherpa-onnx.workspace = true
tar.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true
ureq.workspace = true
whisper-rs.workspace = true

[dev-dependencies]
broscribe-platform-native.workspace = true

[lints]
workspace = true

# Its `main` is also the argv dump the test's `.cmd` shim starts.
[[test]]
name = "argv_through_cmd"
harness = false
