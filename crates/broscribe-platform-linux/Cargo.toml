[package]
name = "broscribe-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
broscribe-platform.workspace = true
broscribe-platform-unix.workspace = true
libc.workspace = true
serde_json.workspace = true
sha2.workspace = true
futures = { workspace = true, features = ["executor", "async-await"] }
cpal = { version = "=0.18.2", features = ["pipewire"] }
pipewire = { version = "=0.10.1", features = ["v0_3_65"] }
atspi = { version = "=0.30.0", default-features = false, features = ["connection", "proxies", "wrappers"] }
# AT-SPI and Secret Service both use the zbus 5 protocol/runtime generation.
zbus = "=5.19.0"
keyring = "=4.2.0"
async-io = "=2.6.0"
x11rb = "=0.14.0"
notify = "=8.2.2"
# Decodes the tray's waveform PNGs (the brand files) into the ARGB pixmaps
# StatusNotifierItem hosts draw; already locked through GPUI's image crate.
png = "=0.18.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
broscribe-readers = { workspace = true, features = ["conformance"] }
tempfile.workspace = true
